<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jadwal Perkuliahan</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    /* ── DESIGN TOKENS ── */
    :root {
      --ink:        #0d0f1a;
      --ink-2:      #3a3e5c;
      --ink-3:      #7a7f9d;
      --surface:    #ffffff;
      --surface-2:  #f4f5fa;
      --surface-3:  #eceef8;
      --border:     rgba(100,105,160,.14);
      --border-2:   rgba(100,105,160,.22);
      --accent:     #4f52e8;
      --accent-dim: rgba(79,82,232,.12);
      --gold:       #c9922a;
      --gold-dim:   rgba(201,146,42,.14);
      --live:       #e53935;
      --live-dim:   rgba(229,57,53,.12);
      --r:          10px;
      --r-lg:       16px;
      --shadow-sm:  0 1px 3px rgba(10,12,40,.06), 0 1px 2px rgba(10,12,40,.04);
      --shadow:     0 4px 16px rgba(10,12,40,.08), 0 1px 4px rgba(10,12,40,.04);
      --tz:         'Asia/Jakarta';
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--ink);
      background: #f0f1f9;
      -webkit-font-smoothing: antialiased;
    }

    /* ── APP SHELL ── */
    .app {
      width: 100%; height: 100vh;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 6px;
      padding: 8px;
      overflow: hidden;
    }

    /* ══════════════════════════════════
       HEADER
    ══════════════════════════════════ */
    .header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 20px;
      padding: 12px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-sm);
    }

    .header-left { display: flex; flex-direction: column; gap: 3px; }

    .eyebrow {
      font-size: 11px; font-weight: 700; letter-spacing: .6px;
      text-transform: uppercase; color: var(--accent);
    }

    .header h1 {
      font-size: 22px; font-weight: 800; line-height: 1.1;
      color: var(--ink);
    }

    .status-bar {
      display: flex; flex-wrap: wrap; gap: 4px 16px;
      margin-top: 2px;
    }

    .status-item {
      font-size: 12px; color: var(--ink-3); font-weight: 500;
    }
    .status-item strong { color: var(--ink-2); font-weight: 700; }

    /* clock block */
    .header-right {
      display: flex; flex-direction: column; align-items: flex-end; gap: 3px;
    }

    .clock-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 38px; font-weight: 700; letter-spacing: -1px;
      color: var(--ink); line-height: 1;
    }

    .clock-date {
      font-size: 12px; font-weight: 600; color: var(--ink-3);
    }

    .mode-pill {
      margin-top: 4px;
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 999px;
      font-size: 11px; font-weight: 700; letter-spacing: .3px;
      transition: background .35s, color .35s;
    }
    .mode-pill.full {
      background: var(--accent-dim); color: var(--accent);
    }
    .mode-pill.live {
      background: var(--live-dim); color: var(--live);
    }
    .mode-pill .dot {
      width: 6px; height: 6px; border-radius: 50%;
    }
    .mode-pill.full .dot { background: var(--accent); }
    .mode-pill.live .dot {
      background: var(--live);
      animation: pulse-dot 2.2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%,100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.4); opacity: .7; }
    }

    .mode-track {
      width: 100%; height: 3px; border-radius: 2px;
      background: var(--surface-3); overflow: hidden;
      margin-top: 3px;
    }
    .mode-fill {
      height: 100%; border-radius: 2px;
      background: var(--accent);
      transition: width 1s linear;
    }
    .mode-pill.live ~ .mode-track .mode-fill { background: var(--live); }

    /* ══════════════════════════════════
       TICKER
    ══════════════════════════════════ */
    .ticker {
      display: flex; align-items: center; gap: 10px;
      padding: 0 14px;
      height: 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .ticker-badge {
      flex-shrink: 0;
      padding: 3px 10px; border-radius: 999px;
      background: var(--accent); color: #fff;
      font-size: 10px; font-weight: 800; letter-spacing: .5px;
      text-transform: uppercase;
    }

    .ticker-vp {
      flex: 1; height: 20px;
      position: relative; overflow: hidden;
    }

    .ticker-item {
      position: absolute; inset: 0;
      display: flex; align-items: center;
      font-size: 13px; font-weight: 500; color: var(--ink-2);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      opacity: 0; transform: translateY(-100%);
      transition: transform .9s cubic-bezier(.22,.82,.24,1), opacity .9s ease;
      will-change: transform, opacity;
    }
    .ticker-item.active { opacity: 1; transform: translateY(0); }
    .ticker-item.out    { opacity: 0; transform: translateY(100%); }
    .ticker-item.reset  { transition: none !important; }

    .ticker-right {
      flex-shrink: 0; display: flex; align-items: center; gap: 6px;
    }
    .refresh-text { font-size: 11px; font-weight: 600; color: var(--ink-3); white-space: nowrap; }
    .refresh-dot  { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); transition: background .3s; }
    .refresh-dot.ok         { background: #4caf50; }
    .refresh-dot.err        { background: var(--live); }
    .refresh-dot.refreshing { background: var(--accent); animation: blink .7s linear infinite; }
    @keyframes blink { 0%,100%{opacity:1}50%{opacity:.25} }

    /* ══════════════════════════════════
       TABLE PANEL
    ══════════════════════════════════ */
    .table-panel {
      min-height: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-sm);
      position: relative; overflow: hidden;
    }

    .view-wrap { position: relative; width: 100%; height: 100%; overflow: hidden; }

    .view-pane {
      position: absolute; inset: 0;
      opacity: 0; transform: translateY(6px) scale(.998);
      transition: opacity .5s ease, transform .5s cubic-bezier(.22,.82,.24,1);
      overflow: hidden; will-change: opacity, transform;
    }
    .view-pane.active  { opacity: 1; transform: none; z-index: 1; }
    .view-pane.inactive{ opacity: 0; z-index: 0; pointer-events: none; }

    /* ── FULL TABLE ── */
    #viewFull { display: flex; flex-direction: column; }

    .tbl-head-wrap {
      flex: 0 0 auto;
      background: var(--surface);
      border-bottom: 1.5px solid var(--border-2);
      overflow: hidden;
      position: relative; z-index: 2;
    }

    .tbl-body-wrap {
      flex: 1 1 auto; min-height: 0;
      overflow-x: hidden; overflow-y: auto;
      background: var(--surface);
      scrollbar-width: thin;
      scrollbar-color: rgba(100,105,200,.25) transparent;
    }
    .tbl-body-wrap::-webkit-scrollbar        { width: 5px; }
    .tbl-body-wrap::-webkit-scrollbar-track  { background: transparent; }
    .tbl-body-wrap::-webkit-scrollbar-thumb  { background: rgba(100,105,200,.25); border-radius: 3px; }

    /* ── TABLE STYLES ── */
    table.sched {
      border-collapse: separate; border-spacing: 0;
      table-layout: fixed; width: 100%;
    }

    table.sched th, table.sched td {
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      text-align: center; vertical-align: middle;
      overflow: hidden; padding: 0 4px;
    }
    table.sched tr > *:first-child { border-left: 1px solid var(--border); }
    table.sched.tbl-h thead tr:first-child > * { border-top: 1px solid var(--border); }

    /* header cells */
    table.sched thead th {
      font-weight: 700; color: var(--ink);
      background: var(--surface-2);
      white-space: nowrap;
      font-size: 11px; letter-spacing: .3px;
    }

    /* colored room headers */
    table.sched thead th.rh-f6 { background: #dceefb; color: #124a7a; }
    table.sched thead th.rh-f4 { background: #d4f0e4; color: #0a3a20; }
    table.sched thead th.rh-def{ background: var(--surface-3); color: var(--ink-2); }

    table.sched.tbl-b tbody tr:first-child > * { border-top: none; }

    td.cell-session { background: var(--surface-2); font-weight: 700; color: var(--ink-2); }
    td.cell-sess-empty { background: var(--surface-2); }
    td.cell-time {
      background: var(--surface-2);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500; color: var(--ink-3);
      white-space: nowrap;
    }
    td.cell-empty { background: var(--surface); }

    td.cell-special-time {
      background: #f0faf3; font-weight: 600; color: #2a6030;
    }
    td.cell-special {
      background: #f0faf3; color: #2a6030; font-weight: 700;
    }

    td.cell-course {
      font-weight: 600; padding: 3px 5px;
      line-height: 1.2; max-width: 0;
    }
    .cc-code { font-weight: 600; opacity: .65; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cc-name { font-weight: 700; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .cc-meta { opacity: .75; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; margin-top: 1px; }

    /* ── ACTIVE ROW HIGHLIGHT ── */
    tr.cur-row td {
      border-top: 2px solid var(--gold) !important;
      border-bottom: 2px solid var(--gold) !important;
    }
    td.cell-time.cur-time {
      background: var(--gold-dim);
      color: var(--gold);
      font-weight: 700;
    }
    td.cell-course.cur-course,
    td.cell-empty.cur-course {
      box-shadow: inset 0 0 0 2px rgba(201,146,42,.55);
    }

    /* ── LIVE VIEW ── */
    .live-view {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      gap: 0; padding: 12px 14px;
      overflow: hidden;
    }

    .live-head {
      display: flex; align-items: center; gap: 8px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .live-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--live);
      animation: pulse-dot 2.5s ease-in-out infinite;
    }
    .live-head-title { font-size: 15px; font-weight: 700; color: var(--ink); }
    .live-head-sub   { font-size: 12px; font-weight: 500; color: var(--ink-3); margin-left: auto; }

    .live-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 8px;
      padding-top: 10px;
      align-content: start;
    }

    .live-card {
      border-radius: var(--r);
      border: 1px solid var(--border);
      padding: 10px 12px;
      display: flex; flex-direction: column; gap: 3px;
      position: relative; overflow: hidden;
      background: var(--surface);
      animation: card-in .45s cubic-bezier(.22,.82,.24,1) both;
    }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .live-card::before {
      content: ''; position: absolute;
      left: 0; top: 0; bottom: 0; width: 3px;
      background: var(--accent);
    }
    .live-room { font-size: 10px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: var(--accent); }
    .live-code { font-size: 11px; font-weight: 600; color: var(--ink-3); }
    .live-name { font-size: 13px; font-weight: 700; line-height: 1.2; }
    .live-meta { font-size: 11px; color: var(--ink-3); }
    .live-time {
      margin-top: 5px; width: fit-content;
      padding: 2px 8px; border-radius: 999px;
      background: var(--gold-dim); color: var(--gold);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; font-weight: 600;
    }

    .live-empty {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 6px; color: var(--ink-3);
      animation: card-in .4s ease;
    }
    .live-empty-icon { font-size: 36px; opacity: .35; }
    .live-empty-text { font-size: 16px; font-weight: 700; }
    .live-empty-sub  { font-size: 13px; }

    /* ── ERROR / TOAST ── */
    .err-box {
      margin: 10px; padding: 12px 14px;
      border-radius: var(--r);
      background: #fff2f2; border: 1px solid #f5c6c6;
      color: #7b1d1d; font-size: 13px; line-height: 1.5;
    }

    .toast {
      position: fixed; bottom: 14px; right: 14px;
      max-width: 320px; padding: 10px 14px;
      background: var(--ink); color: #fff;
      border-radius: var(--r);
      font-size: 12px; font-weight: 600; line-height: 1.5;
      box-shadow: var(--shadow);
      z-index: 9999; display: none;
      animation: toast-in .35s cubic-bezier(.22,.82,.24,1);
    }
    .toast.show { display: block; }
    .toast.warn { background: #7b4b00; }
    .toast.err  { background: #7b1d1d; }
    @keyframes toast-in { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <span class="eyebrow">Semester Genap 2025/2026</span>
      <h1>Jadwal Perkuliahan</h1>
      <div class="status-bar" id="statusBar">Memuat data…</div>
    </div>
    <div class="header-right">
      <div class="clock-time" id="clockTime">--:--:--</div>
      <div class="clock-date" id="clockDate">--</div>
      <div class="mode-pill full" id="modePill">
        <span class="dot"></span>
        <span id="modeLabel">SEMUA SESI</span>
      </div>
      <div class="mode-track">
        <div class="mode-fill" id="modeFill" style="width:100%"></div>
      </div>
    </div>
  </header>

  <!-- TICKER -->
  <div class="ticker">
    <div class="ticker-badge">INFO</div>
    <div class="ticker-vp">
      <div class="ticker-item active" id="tickerA">Memuat informasi…</div>
      <div class="ticker-item"        id="tickerB"></div>
    </div>
    <div class="ticker-right">
      <span class="refresh-text" id="refreshTxt">--</span>
      <span class="refresh-dot"  id="refreshDot"></span>
    </div>
  </div>

  <!-- TABLE PANEL -->
  <section class="table-panel">
    <div class="view-wrap">

      <div class="view-pane active" id="viewFull">
        <div class="tbl-head-wrap"><div id="tblHead"></div></div>
        <div class="tbl-body-wrap" id="tblBody">
          <div class="err-box">Memuat jadwal…</div>
        </div>
      </div>

      <div class="view-pane inactive" id="viewLive">
        <div class="live-view" id="liveView"></div>
      </div>

    </div>
  </section>

</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════
const CONFIG = {
  csvUrl:          'https://docs.google.com/spreadsheets/d/e/2PACX-1vTq4oJ8i4bEvzChaPSP-r_pPaX-kKwbHMROmnL4k5uKaGBv3nVTYD4ktLN_0IzYeQ/pub?output=csv',
  autoRefreshMs:   60_000,
  fallbackDays:    ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],
  roomHeaderClasses: { F6:'rh-f6', F4:'rh-f4' },
  modeSwitchMs:    21_000,
  tickerFallback:  'Selamat datang. Hadir tepat waktu dan perhatikan informasi akademik terbaru.',
  tickerFlipMs:    7_000,
  tickerAnimMs:    900,
  timezone:        'Asia/Jakarta',
  fetchRetryCount: 3,
  fetchRetryMs:    2_000,
  requiredHeaders: ['JENIS_DATA','AKTIF','HARI','KODE_RUANG','NAMA_MK'],
};

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
const state = {
  data: null, selectedDay: 'Senin', csvHash: '',
  liveSlotKey: '', currentMode: 'full',
  modeTimer: null, modeRemainMs: CONFIG.modeSwitchMs,
  tickerItems: [], tickerIndex: 0,
  tickerTimer: null, tickerAnimating: false,
  cachedW: 0, cachedH: 0,
  isVisible: true, lastSuccessAt: null, tableRendered: false,
};

// ═══════════════════════════════════════════════════════════
// DOM
// ═══════════════════════════════════════════════════════════
const el = {
  statusBar:   document.getElementById('statusBar'),
  clockTime:   document.getElementById('clockTime'),
  clockDate:   document.getElementById('clockDate'),
  tickerA:     document.getElementById('tickerA'),
  tickerB:     document.getElementById('tickerB'),
  viewFull:    document.getElementById('viewFull'),
  viewLive:    document.getElementById('viewLive'),
  tblHead:     document.getElementById('tblHead'),
  tblBody:     document.getElementById('tblBody'),
  liveView:    document.getElementById('liveView'),
  modePill:    document.getElementById('modePill'),
  modeLabel:   document.getElementById('modeLabel'),
  modeFill:    document.getElementById('modeFill'),
  refreshTxt:  document.getElementById('refreshTxt'),
  refreshDot:  document.getElementById('refreshDot'),
  toast:       document.getElementById('toast'),
};

// ═══════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════
const n   = v => String(v ?? '').trim();
const nk  = v => n(v).normalize('NFKD').replace(/[^a-zA-Z0-9/]+/g,'').toUpperCase();
const esc = v => String(v ?? '')
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
const isYes = v => { const x = n(v).toLowerCase(); return x===''||['ya','y','true','1','aktif'].includes(x); };

function getNow() { return new Date(new Date().toLocaleString('en-US',{timeZone:CONFIG.timezone})); }
const nowMins = () => { const d=getNow(); return d.getHours()*60+d.getMinutes(); };
const todayName = () => new Intl.DateTimeFormat('id-ID',{weekday:'long',timeZone:CONFIG.timezone}).format(new Date());

function getCanonical(k) {
  const m={
    JENISDATA:'JENIS_DATA',AKTIF:'AKTIF',HARI:'HARI',SESI:'SESI',
    IDSLOT:'ID_SLOT',IDSLOTMULAI:'ID_SLOT_MULAI',IDSLOTSELESAI:'ID_SLOT_SELESAI',
    LABELWAKTU:'LABEL_WAKTU',TIPEBARIS:'TIPE_BARIS',URUTANSLOT:'URUTAN_SLOT',
    KODERUANG:'KODE_RUANG',NAMATAMPILRUANG:'NAMA_TAMPIL_RUANG',
    URUTANKOLOMRUANG:'URUTAN_KOLOM_RUANG',GRUPWARNARUANG:'GRUP_WARNA_RUANG',
    KODEMK:'KODE_MK',NAMAMK:'NAMA_MK',KELAS:'KELAS',DOSEN:'DOSEN',
    PROGRAMANGKATAN:'PROGRAM_ANGKATAN',CATATAN:'CATATAN',KETERANGAN:'CATATAN',
    WARNABG:'WARNA_BG',WARNATEXT:'WARNA_TEXT',
    TANGGALINFO:'TANGGAL_INFO',JENISINFO:'JENIS_INFO',KETERANGANINFO:'KETERANGAN_INFO',
  };
  return m[nk(k)]||k;
}

function parseTime(label) {
  const c = n(label).replace(/–/g,'-');
  const pts = c.split('-').map(x=>n(x));
  if(pts.length<2) return null;
  const p = s=>{ const m=s.match(/(\d{1,2})[.:](\d{2})/); return m?(+m[1]*60+ +m[2]):null; };
  const s=p(pts[0]),e=p(pts[1]);
  return (s!==null&&e!==null)?{start:s,end:e}:null;
}

let toastT=null;
function showToast(msg,type='',ms=4000){
  el.toast.textContent=msg;
  el.toast.className=`toast show${type?' '+type:''}`;
  clearTimeout(toastT);
  if(ms>0) toastT=setTimeout(()=>{el.toast.className='toast';},ms);
}

function setRefresh(s){
  const tf=new Intl.DateTimeFormat('id-ID',{hour:'2-digit',minute:'2-digit',timeZone:CONFIG.timezone});
  el.refreshDot.className=`refresh-dot ${s}`;
  if(s==='refreshing'){
    el.refreshTxt.textContent='Memperbarui…';
  } else if(s==='ok'){
    state.lastSuccessAt=getNow();
    el.refreshTxt.textContent=`Diperbarui ${tf.format(state.lastSuccessAt)}`;
  } else {
    el.refreshTxt.textContent=state.lastSuccessAt?`Gagal — terakhir ${tf.format(state.lastSuccessAt)}`:'Gagal memuat';
  }
}

// ═══════════════════════════════════════════════════════════
// DATA MODEL
// ═══════════════════════════════════════════════════════════
function buildObjects(csv) {
  const rows=Papa.parse(csv,{delimiter:',',quoteChar:'"',escapeChar:'"',skipEmptyLines:false}).data||[];
  const hi=rows.findIndex(r=>nk(r?.[0])==='JENISDATA');
  if(hi===-1) throw new Error('Header JENIS_DATA tidak ditemukan.');
  const headers=rows[hi].map(getCanonical);
  return rows.slice(hi+1)
    .filter(r=>r.some(c=>n(c)!==''))
    .map(r=>{const o={};headers.forEach((h,i)=>{if(h)o[h]=r[i]??'';});return o;});
}

function buildModel(csv) {
  const rows=buildObjects(csv);
  const rooms=rows.filter(r=>n(r.JENIS_DATA).toUpperCase()==='RUANG'&&isYes(r.AKTIF)).sort((a,b)=>(+a.URUTAN_KOLOM_RUANG||0)-(+b.URUTAN_KOLOM_RUANG||0));
  const slots=rows.filter(r=>n(r.JENIS_DATA).toUpperCase()==='SLOT'&&isYes(r.AKTIF)).sort((a,b)=>(+a.URUTAN_SLOT||+a.ID_SLOT||0)-(+b.URUTAN_SLOT||+b.ID_SLOT||0));
  const schedules=rows.filter(r=>n(r.JENIS_DATA).toUpperCase()==='JADWAL'&&isYes(r.AKTIF));
  const infos=rows.filter(r=>n(r.JENIS_DATA).toUpperCase()==='INFO'&&isYes(r.AKTIF));
  const dset=new Set();
  slots.forEach(r=>{if(n(r.HARI))dset.add(n(r.HARI));});
  schedules.forEach(r=>{if(n(r.HARI))dset.add(n(r.HARI));});
  const ord=CONFIG.fallbackDays.filter(d=>dset.has(d));
  const ext=[...dset].filter(d=>!ord.includes(d));
  return {rooms,slots,schedules,infos,days:[...ord,...ext]};
}

function slotsForDay(day){
  const dl=n(day).toLowerCase();
  const sp=state.data.slots.filter(r=>n(r.HARI).toLowerCase()===dl);
  if(sp.length) return sp;
  const gl=state.data.slots.filter(r=>!n(r.HARI));
  return gl.length?gl:state.data.slots;
}

function schedItem(day,roomCode,slotId){
  const dl=n(day).toLowerCase(),rc=n(roomCode),sid=+slotId;
  return state.data.schedules.find(it=>n(it.HARI).toLowerCase()===dl&&n(it.KODE_RUANG)===rc&&sid>=+it.ID_SLOT_MULAI&&sid<=(+(it.ID_SLOT_SELESAI||it.ID_SLOT_MULAI)))||null;
}

function activeSlotId(day){
  if(!state.data||n(day)!==todayName()) return null;
  const cur=nowMins();
  for(const s of slotsForDay(day)){
    if(n(s.TIPE_BARIS).toUpperCase()!=='KULIAH') continue;
    const p=parseTime(s.LABEL_WAKTU);
    if(p&&cur>=p.start&&cur<p.end) return +s.ID_SLOT;
  }
  return null;
}

const academicDay = days => { const c=todayName(); return days.includes(c)?c:(days[0]||'Senin'); };

// ── COLOR ──
const PALETTE=[
  {bg:'#EEF4FA',t:'#1A3050'},{bg:'#EDF7F1',t:'#0E3020'},
  {bg:'#FFF9EC',t:'#3A2800'},{bg:'#FAF0E8',t:'#3A1808'},
  {bg:'#F2EEF9',t:'#1E103A'},{bg:'#EEF6F1',t:'#0C3220'},
  {bg:'#EEF5F6',t:'#0C2A30'},{bg:'#FAEFF0',t:'#3A0C10'},
  {bg:'#F0F4E8',t:'#203010'},{bg:'#F5EEF8',t:'#2C0C38'},
];

function strHash(str,len){
  let h=0;
  for(let i=0;i<str.length;i++) h=(Math.imul(31,h)+str.charCodeAt(i))|0;
  return Math.abs(h)%len;
}

function mkColor(item){
  if(item&&n(item.WARNA_BG)&&n(item.WARNA_TEXT)) return {bg:n(item.WARNA_BG),t:n(item.WARNA_TEXT)};
  const code=n(item?.KODE_MK||'').toUpperCase().replace(/\s+/g,'');
  const known={
    'TI1':{bg:'#EEF4FA',t:'#1A3050'},'TI2':{bg:'#EDF7F1',t:'#0E3020'},
    'TI3':{bg:'#FFF9EC',t:'#3A2800'},'TI4':{bg:'#FAF0E8',t:'#3A1808'},
    'TI5':{bg:'#F2EEF9',t:'#1E103A'},'TI6':{bg:'#EEF6F1',t:'#0C3220'},
    'TI7':{bg:'#EEF5F6',t:'#0C2A30'},'TI8':{bg:'#FAEFF0',t:'#3A0C10'},
  };
  const pfx=code.match(/^([A-Z]+\d)/)?.[1]||'';
  if(pfx&&known[pfx]) return known[pfx];
  if(code) return PALETTE[strHash(code,PALETTE.length)];
  return {bg:'#F3F4FA',t:'#1A1D3A'};
}

function roomHClass(room){
  const g=n(room.GRUP_WARNA_RUANG).toUpperCase();
  return CONFIG.roomHeaderClasses[g]||'rh-def';
}

const LS='jadwal_v3';
function saveCache(csv){ try{localStorage.setItem(LS,JSON.stringify({csv,ts:Date.now()}));}catch(e){} }
function loadCache(){ try{ const r=localStorage.getItem(LS); return r?JSON.parse(r):null; }catch(e){return null;} }

async function hashText(t){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

let rPending=false;
const ro=new ResizeObserver(entries=>{
  for(const e of entries){
    const{width:w,height:h}=e.contentRect;
    if(Math.abs(w-state.cachedW)>2||Math.abs(h-state.cachedH)>2){
      state.cachedW=w; state.cachedH=h;
      if(!rPending){
        rPending=true;
        requestAnimationFrame(()=>{
          rPending=false;
          if(!state.data) return;
          state.tableRendered=false;
          state.currentMode==='full'?renderFull(state.selectedDay):renderLive(state.selectedDay);

});

// SCROLL
// ═══════════════════════════════════════════════════════════
function scrollActive(force=false){
  const band=el.tblBody;
  const tgt=band.querySelector('tr.cur-row');
  if(!tgt){if(force)band?.scrollTo({top:0,behavior:'smooth'});return;}
  const br=band.getBoundingClientRect(),tr=tgt.getBoundingClientRect();
  const st=band.scrollTop,top=st+(tr.top-br.top),bot=top+tr.height;
  if(force||!(top>=st+10&&bot<=st+band.clientHeight-20)){
    const want=top+tr.height/2-band.clientHeight/2;
    const max=Math.max(0,band.scrollHeight-band.clientHeight);
    band.scrollTo({top:Math.max(0,Math.min(max,want)),behavior:'smooth'});
  }
}

function scrollAfterRender(){
  const band=el.tblBody;
  if(!band) return;
  if(band.querySelector('tbody')){scrollActive(true);return;}
  let done=false;
  const mo=new MutationObserver(()=>{
    if(band.querySelector('tbody')&&!done){done=true;mo.disconnect();scrollActive(true);}
  });
  mo.observe(band,{childList:true,subtree:true});
  setTimeout(()=>{if(!done){done=true;mo.disconnect();scrollActive(true);}},800);
}

  band.querySelectorAll('td.cur-time').forEach(td=>td.classList.remove('cur-time'));

    row.querySelectorAll('td.cell-course,td.cell-empty').forEach(td=>td.classList.add('cur-course'));
  });
}

// RENDER FULL TABLE
// ═══════════════════════════════════════════════════════════
function renderFull(day,force=false){
  if(!state.data){
    el.tblHead.innerHTML='';
    el.tblBody.innerHTML='<div class="err-box">Data belum tersedia.</div>';
    return;
  }
  const slots=slotsForDay(day),rooms=state.data.rooms;
  const aid=activeSlotId(day);

  if(!rooms.length){el.tblBody.innerHTML='<div class="err-box">Data RUANG tidak ditemukan.</div>';return;}
  if(!slots.length){el.tblBody.innerHTML='<div class="err-box">Data SLOT tidak ditemukan.</div>';return;}

  if(state.tableRendered&&!force){
    updateHighlight(aid);scrollActive(false);return;
  }

  const cH=Math.max(360,state.cachedH||el.viewFull.clientHeight-4);
  const cW=Math.max(200,state.cachedW||el.viewFull.clientWidth-4);

  const thH=Math.max(36,Math.min(48,Math.floor(cH*.06)));
  const rowH=Math.max(38,Math.min(60,Math.floor(cH*.074)));
  const specH=Math.max(20,Math.min(30,Math.floor(rowH*.52)));
  const sesiW=48, jamW=106;
  const roomW=Math.max(60,Math.floor((cW-sesiW-jamW-8)/Math.max(rooms.length,1)));

  const fHd=Math.max(10,Math.min(15,Math.floor(roomW*.11)));
  const fBase=Math.max(9,Math.min(13,Math.floor(roomW*.093)));
  const fCode=Math.max(8,Math.min(11,Math.floor(fBase*.88)));
  const fMeta=Math.max(7,Math.min(10,Math.floor(fBase*.8)));

  const cols=`<colgroup><col style="width:${sesiW}px"><col style="width:${jamW}px">${rooms.map(()=>'<col>').join('')}</colgroup>`;

  // header
  el.tblHead.innerHTML=`<table class="sched tbl-h" style="width:100%;font-size:${fBase}px;">${cols}<thead>
    <tr style="height:${thH}px;">
      <th style="font-size:${fHd}px;">SESI</th>
      <th style="font-size:${fHd}px;">JAM</th>
      ${rooms.map(r=>`<th class="${roomHClass(r)}" style="font-size:${fHd}px;">${esc(r.NAMA_TAMPIL_RUANG||r.KODE_RUANG)}</th>`).join('')}
    </tr>
  </thead></table>`;

  // body
  const sCnt=new Map(), rSess=new Set();
  slots.forEach(s=>{
    if(n(s.TIPE_BARIS).toUpperCase()==='KULIAH'){
      const k=n(s.SESI)||'-'; sCnt.set(k,(sCnt.get(k)||0)+1);
    }
  });

  let rows='';
  for(const slot of slots){
    const type=n(slot.TIPE_BARIS).toUpperCase();
    const sid=+slot.ID_SLOT;
    const isCur=(type==='KULIAH')&&(aid===sid);
    const rH=(type==='KULIAH')?rowH:specH;
    rows+=`<tr class="${isCur?'cur-row':''}" data-slot="${sid}">`;
    if(type==='KULIAH'){
      const sesi=n(slot.SESI)||'-';
      if(!rSess.has(sesi)){
        rows+=`<td class="cell-session" rowspan="${sCnt.get(sesi)||1}" style="height:${rH}px;font-size:${fBase}px;">${esc(sesi)}</td>`;
        rSess.add(sesi);
      }
      rows+=`<td class="cell-time${isCur?' cur-time':''}" style="height:${rH}px;font-size:${Math.max(9,fBase*.93)}px;">${esc(slot.LABEL_WAKTU)}</td>`;
      for(const room of rooms){
        const item=schedItem(day,room.KODE_RUANG,sid);
        if(item){
          const c=mkColor(item);
          rows+=`<td class="cell-course${isCur?' cur-course':''}" style="height:${rH}px;background:${c.bg};color:${c.t};">
            <div class="cc-code" style="font-size:${fCode}px;">${esc(item.KODE_MK||'')}${item.KELAS?` (${esc(item.KELAS)})`:''}  </div>
            <div class="cc-name" style="font-size:${fBase}px;">${esc(item.NAMA_MK||'')}</div>
            ${item.DOSEN?`<div class="cc-meta" style="font-size:${fMeta}px;">👤 ${esc(item.DOSEN)}</div>`:''}
            ${item.PROGRAM_ANGKATAN?`<div class="cc-meta" style="font-size:${fMeta}px;">${esc(item.PROGRAM_ANGKATAN)}</div>`:''}
          </td>`;
        } else {
          rows+=`<td class="cell-empty${isCur?' cur-course':''}" style="height:${rH}px;"></td>`;
        }
      }
    } else {
      rows+=`<td class="cell-sess-empty" style="height:${rH}px;"></td>`;
      rows+=`<td class="cell-special-time" style="height:${rH}px;font-size:${fMeta}px;">${esc(slot.LABEL_WAKTU)}</td>`;
      rows+=`<td class="cell-special" colspan="${rooms.length}" style="height:${rH}px;font-size:${fMeta}px;">${esc(n(slot.CATATAN)||'Informasi akademik')}</td>`;
    }
    rows+='</tr>';
  }

  el.tblBody.innerHTML=`<table class="sched tbl-b" style="width:100%;font-size:${fBase}px;">${cols}<tbody>${rows}</tbody></table>`;
  state.tableRendered=true;
  scrollAfterRender();
}

function renderLive(day){
  const aid=activeSlotId(day);
  const slots=state.data?slotsForDay(day):[];
  const aSlot=slots.find(s=>+s.ID_SLOT===aid);
  const tLabel=aSlot?n(aSlot.LABEL_WAKTU):'';

  if(!aid||!state.data){
    el.liveView.innerHTML=`<div class="live-empty">
      <div class="live-empty-icon">🎓</div>
      <div class="live-empty-text">Belum ada sesi aktif</div>
      <div class="live-empty-sub">Perkuliahan berikutnya ditampilkan saat sesi dimulai</div>
    </div>`;
    return;
  }

  const rooms=state.data.rooms;
  const items=rooms.map(r=>{const it=schedItem(day,r.KODE_RUANG,aid);return it?{room:r,item:it}:null;}).filter(Boolean);
  let html=`<div class="live-head"><div class="live-dot"></div><div class="live-head-title">Berlangsung Sekarang</div><div class="live-head-sub">Sesi ${aSlot?n(aSlot.SESI):''} · ${esc(tLabel)}</div></div>`;
  html+=`<div class="live-grid">`;
  if(!items.length){
    html+=`<div class="live-empty"><div class="live-empty-icon">📭</div><div class="live-empty-text">Tidak ada mata kuliah di sesi ini</div></div>`;
  } else {
    items.forEach(({room,item},i)=>{
      const c=mkColor(item);
      html+=`<div class="live-card" style="border-color:${c.bg};animation-delay:${i*55}ms;">
        <div class="live-room">${esc(room.NAMA_TAMPIL_RUANG||room.KODE_RUANG)}</div>
        <div class="live-code">${esc(item.KODE_MK||'')}${item.KELAS?` · Kelas ${esc(item.KELAS)}`:''}</div>
        <div class="live-name" style="color:${c.t}">${esc(item.NAMA_MK||'')}</div>
        ${item.DOSEN?`<div class="live-meta">👤 ${esc(item.DOSEN)}</div>`:''}
        ${item.PROGRAM_ANGKATAN?`<div class="live-meta">🎓 ${esc(item.PROGRAM_ANGKATAN)}</div>`:''}
        <div class="live-time">⏱ ${esc(tLabel)}</div>
      </div>`;
    });
  }
  html+=`</div>`;
  el.liveView.innerHTML=html;
}

// TICKER
// ═══════════════════════════════════════════════════════════
let tickActive=true; // A=true → tickerA is active

function stopTicker(){ if(state.tickerTimer){clearInterval(state.tickerTimer);state.tickerTimer=null;} }

function resetTicker(text){
  el.tickerA.className='ticker-item reset';
  el.tickerA.textContent=text;
  el.tickerB.className='ticker-item reset';
  el.tickerB.textContent='';
  void el.tickerA.offsetWidth;
  requestAnimationFrame(()=>{
    el.tickerA.className='ticker-item active';
    el.tickerB.className='ticker-item';
  });
  tickActive=true;
}

function flipTicker(){
  if(state.tickerAnimating||state.tickerItems.length<=1) return;
  state.tickerAnimating=true;
  const nIdx=(state.tickerIndex+1)%state.tickerItems.length;
  const nxt=state.tickerItems[nIdx];
  const cur=tickActive?el.tickerA:el.tickerB;
  const nxtEl=tickActive?el.tickerB:el.tickerA;
  nxtEl.className='ticker-item reset';
  nxtEl.textContent=nxt;
  void nxtEl.offsetWidth;
  nxtEl.className='ticker-item';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    cur.classList.add('out');
    nxtEl.classList.add('active');
  }));
  setTimeout(()=>{
    cur.className='ticker-item';
    cur.textContent='';
    tickActive=!tickActive;
    state.tickerIndex=nIdx;
    state.tickerAnimating=false;
  },CONFIG.tickerAnimMs);
}

function startTicker(){ stopTicker(); if(state.tickerItems.length>1) state.tickerTimer=setInterval(flipTicker,CONFIG.tickerFlipMs); }

function updateTicker(){
  if(!state.data){ state.tickerItems=[CONFIG.tickerFallback]; resetTicker(CONFIG.tickerFallback); stopTicker(); return; }
  const items=state.data.infos.map(r=>[n(r.TANGGAL_INFO),n(r.JENIS_INFO),n(r.KETERANGAN_INFO)].filter(Boolean).join(' — ')).filter(Boolean);
  state.tickerItems=items.length?items:[CONFIG.tickerFallback];
  state.tickerIndex=0;
  resetTicker(state.tickerItems[0]);
  startTicker();
}

    state.modeRemainMs-=1000;
    if(state.modeRemainMs<=0) switchMode(state.currentMode==='full'?'live':'full');
    el.modeFill.style.width=Math.max(0,(state.modeRemainMs/CONFIG.modeSwitchMs)*100)+'%';
  },1000);
}

// ═══════════════════════════════════════════════════════════
// MASTER TICK
// ═══════════════════════════════════════════════════════════
function startTick(){
  const tf=new Intl.DateTimeFormat('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit',timeZone:CONFIG.timezone});
  const df=new Intl.DateTimeFormat('id-ID',{weekday:'long',day:'2-digit',month:'long',year:'numeric',timeZone:CONFIG.timezone});
  function tick(){
    const now=new Date();
    el.clockTime.textContent=tf.format(now);
    el.clockDate.textContent=df.format(now);
    if(!state.data) return;
    const days=state.data.days.length?state.data.days:CONFIG.fallbackDays;
    const auto=academicDay(days);
    if(auto!==state.selectedDay){
      state.selectedDay=auto; state.tableRendered=false;
      updateStatus();
      state.currentMode==='full'?renderFull(state.selectedDay,true):renderLive(state.selectedDay);
      return;
    }
    const aid=activeSlotId(state.selectedDay);
    const lk=`${state.selectedDay}__${aid||''}`;
    if(lk!==state.liveSlotKey){
      state.liveSlotKey=lk; state.tableRendered=false;
      updateStatus();
      state.currentMode==='full'?renderFull(state.selectedDay,true):renderLive(state.selectedDay);
    } else if(state.currentMode==='full'){
      updateHighlight(aid); scrollActive(false);
    }
  }
  tick(); setInterval(tick,1000);
}

// ═══════════════════════════════════════════════════════════
// FETCH CSV
// ═══════════════════════════════════════════════════════════
async function fetchCsv(){
  let last;
  for(let i=0;i<CONFIG.fetchRetryCount;i++){
    try{
      const r=await fetch(`${CONFIG.csvUrl}&v=${Date.now()}`,{cache:'no-store'});
      if(!r.ok) throw new Error(`HTTP ${r.status}`);
      return await r.text();
    }catch(e){
      last=e;
      if(i<CONFIG.fetchRetryCount-1) await new Promise(res=>setTimeout(res,CONFIG.fetchRetryMs));
    }
  }
  throw last;
}

async function applyCSV(csv,hash){
  state.data=buildModel(csv);
  state.csvHash=hash||await hashText(csv);
  const days=state.data.days.length?state.data.days:CONFIG.fallbackDays;
  state.selectedDay=academicDay(days);
  state.liveSlotKey=`${state.selectedDay}__${activeSlotId(state.selectedDay)||''}`;
  state.tableRendered=false;
  saveCache(csv);
  updateTicker(); updateStatus();
  renderFull(state.selectedDay,true);
  renderLive(state.selectedDay);
}

setInterval(async()=>{
  if(!state.isVisible) return;
  setRefresh('refreshing');
  try{
    const csv=await fetchCsv();
    const h=await hashText(csv);
    if(h!==state.csvHash){ await applyCSV(csv,h); showToast('Data jadwal berhasil diperbarui.','',3000); }
    setRefresh('ok');
  }catch(e){
    console.warn('[Jadwal] Refresh gagal:',e);
    setRefresh('err');
    showToast('Gagal memperbarui data. Menampilkan data terakhir.','warn',5000);
  }
},CONFIG.autoRefreshMs);

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
(async function init(){
  startTick();
  setRefresh('refreshing');
  try{
    const csv=await fetchCsv();
    const h=await hashText(csv);
    await applyCSV(csv,h);
    setRefresh('ok');
    switchMode('full');
    startModeTimer();
  }catch(e){
    console.warn('[Jadwal] Gagal fetch:',e);
    setRefresh('err');
    const cached=loadCache();
    if(cached){
      const age=Math.round((Date.now()-cached.ts)/60000);
      showToast(`Data terbaru tidak tersedia. Menampilkan data dari ${age} menit lalu.`,'warn',7000);
      try{
        const h=await hashText(cached.csv);
        await applyCSV(cached.csv,h);
        switchMode('full'); startModeTimer(); return;
      }catch(e2){ console.warn('[Jadwal] Cache gagal:',e2); }
    }
    el.tblBody.innerHTML=`<div class="err-box">Gagal memuat jadwal: ${esc(e.message)}<br><br>Pastikan Google Sheets sudah dipublish sebagai CSV publik, lalu muat ulang halaman.</div>`;
    showToast('Gagal memuat data jadwal.','err',0);
  }
})();
</script>
