<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jadwal Perkuliahan Mahasiswa</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    :root{
      --panel:rgba(255,255,255,.70);
      --panel-strong:rgba(255,255,255,.82);
      --navy:#5C61B9;
      --navy-dark:#2E317B;
      --text:#283247;
      --muted:#66728A;
      --grid:#C9D0DF;
      --special:#EEF5E7;
      --special-dark:#4A5D36;
      --empty:#F4F5F8;
      --room-f6:#F7F0D8;
      --room-f4:#DFF0F4;
      --room-default:#ECEEFA;
      --radius:24px;
      --shadow:0 20px 50px rgba(88, 83, 155, .14);
      --shadow-soft:0 10px 24px rgba(103, 97, 176, .10);
      --gold:#D6BE7B;
      --gold-soft:#F7EFD1;
    }

    *{box-sizing:border-box}

    html,body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      font-family:Arial, Helvetica, sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 8% 12%, rgba(195,188,241,.32) 0, rgba(195,188,241,0) 24%),
        radial-gradient(circle at 92% 82%, rgba(255,206,214,.28) 0, rgba(255,206,214,0) 22%),
        radial-gradient(circle at 88% 18%, rgba(197,235,241,.32) 0, rgba(197,235,241,0) 18%),
        linear-gradient(135deg, #EEF0FA 0%, #F8F5F3 52%, #F2F6EE 100%);
    }

    body::before,
    body::after{
      content:'';
      position:fixed;
      border-radius:50%;
      filter:blur(18px);
      opacity:.55;
      pointer-events:none;
      z-index:0;
    }

    body::before{
      width:360px;
      height:360px;
      left:-90px;
      top:110px;
      background:radial-gradient(circle, rgba(180,170,235,.42) 0%, rgba(180,170,235,0) 70%);
    }

    body::after{
      width:300px;
      height:300px;
      right:-70px;
      bottom:40px;
      background:radial-gradient(circle, rgba(246,201,213,.42) 0%, rgba(246,201,213,0) 70%);
    }

    .app{
      position:relative;
      z-index:1;
      width:100%;
      height:100vh;
      padding:8px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .header-panel,.ticker-panel,.table-panel{
      background:var(--panel);
      border:1px solid rgba(255,255,255,.78);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
    }

    .header-panel{
      flex:0 0 auto;
      padding:10px 18px 8px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.86) 0%, rgba(250,247,255,.72) 48%, rgba(247,251,255,.74) 100%);
      position:relative;
      overflow:hidden;
    }

    .header-panel::after{
      content:'';
      position:absolute;
      right:-40px;
      top:-30px;
      width:220px;
      height:220px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(202,211,255,.28) 0%, rgba(202,211,255,0) 72%);
      pointer-events:none;
    }

    .header-main{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:16px;
    }

    .title-wrap{
      min-width:0;
      position:relative;
      padding-top:16px;
    }

    .title-wrap::before{
      content:'Semester Genap 2025/2026';
      position:absolute;
      left:0;
      top:0;
      padding:4px 10px;
      border-radius:999px;
      background:linear-gradient(135deg, rgba(122,126,209,.14), rgba(241,205,219,.18));
      color:var(--navy-dark);
      font-size:11px;
      font-weight:800;
      letter-spacing:.35px;
      box-shadow:var(--shadow-soft);
    }

    .title-wrap h1{
      margin:0 0 4px;
      color:var(--navy-dark);
      font-size:clamp(24px, 2.55vw, 50px);
      line-height:1.01;
      letter-spacing:.15px;
      text-shadow:0 2px 0 rgba(255,255,255,.55);
    }

    .title-wrap p{
      margin:0;
      color:var(--muted);
      font-size:clamp(11px, .78vw, 15px);
      line-height:1.18;
      max-width:760px;
    }

    .mini-status{
      margin-top:6px;
      color:var(--navy-dark);
      font-size:12px;
      font-weight:800;
      line-height:1.35;
      background:rgba(255,255,255,.55);
      border:1px solid rgba(122,126,209,.12);
      border-radius:16px;
      padding:8px 12px;
      display:inline-flex;
      flex-wrap:wrap;
      gap:10px 18px;
      align-items:center;
      box-shadow:var(--shadow-soft);
    }

    .mini-status .status-item{
      white-space:nowrap;
      display:inline-flex;
      align-items:center;
    }

    .clock{
      flex:0 0 auto;
      text-align:right;
      min-width:290px;
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      justify-content:center;
      padding:10px 14px;
      border-radius:20px;
      background:linear-gradient(135deg, rgba(255,255,255,.72), rgba(241,238,255,.72));
      box-shadow:var(--shadow-soft);
      border:1px solid rgba(255,255,255,.8);
    }

    .clock-time{
      color:var(--navy-dark);
      font-size:clamp(36px, 3.4vw, 72px);
      font-weight:800;
      line-height:1;
      letter-spacing:1px;
      text-shadow:0 2px 0 rgba(255,255,255,.6);
    }

    .clock-date{
      margin-top:4px;
      color:#4C568C;
      font-size:clamp(20px, 1.65vw, 34px);
      font-weight:800;
      line-height:1.03;
      letter-spacing:.18px;
    }

    .ticker-panel{
      flex:0 0 auto;
      min-height:44px;
      display:flex;
      align-items:center;
      overflow:hidden;
      padding:0 14px;
      color:var(--navy-dark);
      background:linear-gradient(90deg, rgba(117,124,208,.18) 0%, rgba(255,255,255,.72) 48%, rgba(241,204,216,.24) 100%);
    }

    .ticker-label{
      flex:0 0 auto;
      margin-right:16px;
      font-size:12px;
      font-weight:800;
      letter-spacing:.3px;
      color:var(--navy-dark);
      background:rgba(255,255,255,.72);
      padding:6px 10px;
      border-radius:999px;
      box-shadow:var(--shadow-soft);
    }

    .ticker-viewport{
      flex:1 1 auto;
      min-width:0;
      white-space:nowrap;
      overflow:hidden;
      position:relative;
      height:24px;
      display:flex;
      align-items:center;
    }

    .ticker-track{
      display:inline-block;
      white-space:nowrap;
      padding-left:100%;
      will-change:transform;
      animation:tickerMove 48s linear infinite;
      font-size:16px;
      font-weight:800;
      line-height:1.2;
      letter-spacing:.15px;
      color:#48527D;
    }

    @keyframes tickerMove{
      from{transform:translateX(0)}
      to{transform:translateX(-100%)}
    }

    .table-panel{
      flex:1 1 auto;
      min-height:0;
      padding:8px;
      overflow:hidden;
      background:linear-gradient(180deg, rgba(255,255,255,.66), rgba(251,249,255,.58));
    }

    .table-stage{
      width:100%;
      height:100%;
      position:relative;
      overflow:hidden;
      border-radius:22px;
      background:linear-gradient(180deg, rgba(255,255,255,.45), rgba(245,242,250,.38));
      border:1px solid rgba(255,255,255,.72);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
    }

    .table-scale{
      position:absolute;
      top:0;
      left:0;
      width:100%;
      transform-origin:top left;
      will-change:transform;
    }

    table.schedule{
      width:100%;
      border-collapse:separate;
      border-spacing:0;
      table-layout:fixed;
      background:rgba(255,255,255,.84);
      box-shadow:0 12px 32px rgba(104, 98, 181, .10);
      border-radius:20px;
      overflow:hidden;
      --thead-height:40px;
      --row-height:34px;
      --special-row-height:24px;
      --header-font:13px;
      --cell-font:11px;
      --code-font:9px;
      --meta-font:8px;
      --special-font:10px;
      --session-font:11px;
    }

    .schedule th,.schedule td{
      border-right:1px solid var(--grid);
      border-bottom:1px solid var(--grid);
      text-align:center;
      vertical-align:middle;
      padding:2px 4px;
    }

    .schedule tr > *:first-child{
      border-left:1px solid var(--grid);
    }

    .schedule thead tr:first-child > *{
      border-top:1px solid var(--grid);
    }

    .schedule thead th{
      height:var(--thead-height);
      font-size:var(--header-font);
      font-weight:800;
      color:#ffffff;
      background:linear-gradient(180deg, #888DD9 0%, #6E74C8 100%);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
    }

    .schedule thead th.room-head{ color:#33405D; }
    .schedule thead th.room-head.group-f6{ background:var(--room-f6); }
    .schedule thead th.room-head.group-f4{ background:var(--room-f4); }
    .schedule thead th.room-head.group-default{ background:var(--room-default); }

    td.session-cell,td.session-empty{
      background:#FAFBFE;
      font-size:var(--session-font);
      font-weight:700;
      color:#4D567A;
    }

    td.time-cell{
      background:#F8F8FB;
      font-size:var(--session-font);
      font-weight:800;
      color:#5B6488;
      white-space:nowrap;
      height:var(--row-height);
    }

    td.empty-cell{
      background:var(--empty);
      height:var(--row-height);
    }

    td.course-cell{
      height:var(--row-height);
      font-size:var(--cell-font);
      line-height:1.14;
      font-weight:700;
      word-break:break-word;
      overflow-wrap:anywhere;
    }

    .course-code{
      font-size:var(--code-font);
      margin-bottom:1px;
      line-height:1.02;
    }

    .course-name{
      font-size:var(--cell-font);
      font-weight:800;
      margin-bottom:1px;
      line-height:1.03;
    }

    .course-meta{
      font-size:var(--meta-font);
      font-weight:600;
      margin-top:1px;
      opacity:.96;
      line-height:1.02;
    }

    td.special-time{
      background:#eef5e8;
      font-size:var(--special-font);
      font-weight:700;
      height:var(--special-row-height);
    }

    td.special-cell{
      background:var(--special);
      color:var(--special-dark);
      font-size:var(--special-font);
      font-weight:800;
      letter-spacing:.08px;
      padding:1px 4px;
      height:var(--special-row-height);
    }

    .schedule tr.current-row td{
      border-top:2px solid var(--gold);
      border-bottom:2px solid var(--gold);
      background-clip:padding-box;
    }

    td.time-cell.current-time{
      background:var(--gold-soft);
      color:#655A3D;
      font-weight:800;
    }

    td.course-cell.current-course{
      box-shadow: inset 0 0 0 2px var(--gold), 0 10px 20px rgba(214,190,123,.12);
      position:relative;
      z-index:1;
    }

    .live-badge{
      display:inline-block;
      margin-bottom:3px;
      padding:2px 7px;
      border-radius:999px;
      background:linear-gradient(180deg, #FAF1D5 0%, #F4E6B8 100%);
      color:#5D5136;
      font-size:calc(var(--meta-font) + .7px);
      font-weight:800;
      letter-spacing:.2px;
      white-space:nowrap;
      box-shadow:0 3px 8px rgba(214,190,123,.18);
    }


    .schedule thead tr:first-child th:first-child{
      border-top-left-radius:18px;
    }

    .schedule thead tr:first-child th:last-child{
      border-top-right-radius:18px;
    }

    .schedule tbody tr:last-child td:first-child{
      border-bottom-left-radius:18px;
    }

    .schedule tbody tr:last-child td:last-child{
      border-bottom-right-radius:18px;
    }

    .error-box{
      margin:10px;
      padding:16px;
      border-radius:12px;
      background:#fff0f0;
      border:1px solid #efb0b0;
      color:#7b1d1d;
      font-size:14px;
      line-height:1.5;
    }

    @media (max-width:880px){
      .header-main{
        flex-direction:column;
      }
      .clock{
        text-align:left;
        min-width:0;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="header-panel">
      <div class="header-main">
        <div class="title-wrap">
          <h1>Jadwal Perkuliahan Mahasiswa</h1>
          
          <div class="mini-status" id="miniStatus">Memuat data spreadsheet...</div>
        </div>
        <div class="clock">
          <div class="clock-time" id="clockTime">--:--:--</div>
          <div class="clock-date" id="clockDate">Memuat tanggal...</div>
        </div>
      </div>
    </section>

    <section class="ticker-panel">
      <div class="ticker-label">INFO PERKULIAHAN</div>
      <div class="ticker-viewport">
        <div class="ticker-track" id="tickerTrack">Memuat informasi perkuliahan tambahan...</div>
      </div>
    </section>

    <section class="table-panel">
      <div class="table-stage" id="tableStage">
        <div class="error-box">Sedang memuat data spreadsheet...</div>
      </div>
    </section>
  </div>

  <script>
    const CONFIG = {
      csvUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTq4oJ8i4bEvzChaPSP-r_pPaX-kKwbHMROmnL4k5uKaGBv3nVTYD4ktLN_0IzYeQ/pub?output=csv',
      autoRefreshMs: 60000,
      fallbackDays: ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'],
      roomHeaderClasses: { F6: 'group-f6', F4: 'group-f4' },
      tickerFallback: 'Selamat datang. Pastikan hadir tepat waktu dan perhatikan informasi akademik terbaru.'
    };

    const state = {
      data: null,
      selectedDay: 'Senin',
      csvHash: '',
      autoRefreshBusy: false,
      autoRefreshTimer: null,
      liveSlotKey: ''
    };

    const el = {
      tableStage: document.getElementById('tableStage'),
      tickerTrack: document.getElementById('tickerTrack'),
      miniStatus: document.getElementById('miniStatus'),
      clockTime: document.getElementById('clockTime'),
      clockDate: document.getElementById('clockDate')
    };

    function normalizeText(value){ return String(value ?? '').trim(); }
    function normalizeKey(value){
      return normalizeText(value).normalize('NFKD').replace(/[^a-zA-Z0-9/]+/g, '').toUpperCase();
    }
    function isYes(value){
      const v = normalizeText(value).toLowerCase();
      return v === '' || ['ya','y','true','1','aktif'].includes(v);
    }
    function escapeHtml(value){
      return String(value ?? '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }
    function normalizeHexColor(value){
      const raw = normalizeText(value).replace(/[^#a-fA-F0-9]/g,'');
      if (!raw) return '';
      if (raw.startsWith('#')) {
        if (raw.length === 4) return ('#' + raw.slice(1).split('').map(ch => ch + ch).join('')).toUpperCase();
        if (raw.length === 7) return raw.toUpperCase();
        if (raw.length === 9) return ('#' + raw.slice(3)).toUpperCase();
      }
      if (/^[A-Fa-f0-9]{6}$/.test(raw)) return ('#' + raw).toUpperCase();
      if (/^[A-Fa-f0-9]{8}$/.test(raw)) return ('#' + raw.slice(2)).toUpperCase();
      return '';
    }

    function getCanonicalKey(rawKey){
      const key = normalizeKey(rawKey);
      const aliasMap = {
        JENISDATA:'JENIS_DATA',
        AKTIF:'AKTIF',
        HARI:'HARI',
        SESI:'SESI',
        IDSLOT:'ID_SLOT',
        IDSLOTMULAI:'ID_SLOT_MULAI',
        IDSLOTSELESAI:'ID_SLOT_SELESAI',
        LABELWAKTU:'LABEL_WAKTU',
        TIPEBARIS:'TIPE_BARIS',
        URUTANSLOT:'URUTAN_SLOT',
        KODERUANG:'KODE_RUANG',
        NAMATAMPILRUANG:'NAMA_TAMPIL_RUANG',
        URUTANKOLOMRUANG:'URUTAN_KOLOM_RUANG',
        GRUPWARNARUANG:'GRUP_WARNA_RUANG',
        KODEMK:'KODE_MK',
        NAMAMK:'NAMA_MK',
        KELAS:'KELAS',
        DOSEN:'DOSEN',
        PROGRAMANGKATAN:'PROGRAM_ANGKATAN',
        CATATAN:'CATATAN',
        KETERANGAN:'CATATAN',
        WARNABG:'WARNA_BG',
        WARNATEXT:'WARNA_TEXT',
        TANGGALINFO:'TANGGAL_INFO',
        JENISINFO:'JENIS_INFO',
        KETERANGANINFO:'KETERANGAN_INFO'
      };
      return aliasMap[key] || rawKey;
    }

    function parseCsvRows(csvText){
      const parsed = Papa.parse(csvText, {
        delimiter: ',',
        newline: '',
        quoteChar: '"',
        escapeChar: '"',
        skipEmptyLines: false
      });

      if (parsed.errors && parsed.errors.length) {
        console.warn(parsed.errors);
      }

      return parsed.data || [];
    }

    function buildObjectsFromCsv(csvText){
      const rows = parseCsvRows(csvText);
      const headerIndex = rows.findIndex(row => normalizeKey(row?.[0]) === 'JENISDATA');
      if (headerIndex === -1) {
        throw new Error('Baris header tidak ditemukan. Pastikan kolom pertama bernama JENIS_DATA.');
      }

      const headerRow = rows[headerIndex];
      const headers = headerRow.map(h => getCanonicalKey(h));

      const objects = [];
      for (let r = headerIndex + 1; r < rows.length; r += 1) {
        const row = rows[r] || [];
        const hasContent = row.some(cell => normalizeText(cell) !== '');
        if (!hasContent) continue;

        const obj = {};
        headers.forEach((header, index) => {
          if (!header) return;
          obj[header] = row[index] ?? '';
        });
        objects.push(obj);
      }
      return objects;
    }

    function buildDataModel(csvText){
      const rows = buildObjectsFromCsv(csvText);

      const rooms = rows
        .filter(row => normalizeText(row.JENIS_DATA).toUpperCase() === 'RUANG' && isYes(row.AKTIF))
        .sort((a,b) => Number(a.URUTAN_KOLOM_RUANG || 0) - Number(b.URUTAN_KOLOM_RUANG || 0));

      const slotRows = rows
        .filter(row => normalizeText(row.JENIS_DATA).toUpperCase() === 'SLOT' && isYes(row.AKTIF))
        .sort((a,b) => Number(a.URUTAN_SLOT || a.ID_SLOT || 0) - Number(b.URUTAN_SLOT || b.ID_SLOT || 0));

      const scheduleRows = rows
        .filter(row => normalizeText(row.JENIS_DATA).toUpperCase() === 'JADWAL' && isYes(row.AKTIF))
        .map(row => ({
          ...row,
          WARNA_BG: normalizeHexColor(row.WARNA_BG) || '#D9D9D9',
          WARNA_TEXT: normalizeHexColor(row.WARNA_TEXT) || '#111111'
        }));

      const infoRows = rows
        .filter(row => normalizeText(row.JENIS_DATA).toUpperCase() === 'INFO' && isYes(row.AKTIF));

      const daysSet = new Set();
      slotRows.forEach(row => { if (normalizeText(row.HARI)) daysSet.add(normalizeText(row.HARI)); });
      scheduleRows.forEach(row => { if (normalizeText(row.HARI)) daysSet.add(normalizeText(row.HARI)); });

      const orderedDays = CONFIG.fallbackDays.filter(day => daysSet.has(day));
      const extraDays = [...daysSet].filter(day => !orderedDays.includes(day));
      const hasGlobalSlots = slotRows.some(row => !normalizeText(row.HARI));

      return {
        rooms,
        slots: slotRows,
        schedules: scheduleRows,
        infos: infoRows,
        hasGlobalSlots,
        days: [...orderedDays, ...extraDays]
      };
    }

    function getCurrentAcademicDay(days){
      const jsDay = new Date().getDay();
      const map = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
      const current = map[jsDay];
      if (days.includes(current)) return current;
      return days[0] || 'Senin';
    }

    function getSlotsForDay(day){
      const targetDay = normalizeText(day).toLowerCase();
      const specificSlots = state.data.slots
        .filter(row => normalizeText(row.HARI).toLowerCase() === targetDay)
        .sort((a,b) => Number(a.URUTAN_SLOT || a.ID_SLOT || 0) - Number(b.URUTAN_SLOT || b.ID_SLOT || 0));

      if (specificSlots.length) return specificSlots;

      const globalSlots = state.data.slots
        .filter(row => !normalizeText(row.HARI))
        .sort((a,b) => Number(a.URUTAN_SLOT || a.ID_SLOT || 0) - Number(b.URUTAN_SLOT || b.ID_SLOT || 0));

      if (globalSlots.length) return globalSlots;

      return state.data.slots
        .sort((a,b) => Number(a.URUTAN_SLOT || a.ID_SLOT || 0) - Number(b.URUTAN_SLOT || b.ID_SLOT || 0));
    }

    function groupSessionRows(slots){
      const groups = new Map();
      slots.forEach(slot => {
        if (normalizeText(slot.TIPE_BARIS).toUpperCase() === 'KULIAH') {
          const key = normalizeText(slot.SESI) || '-';
          groups.set(key, (groups.get(key) || 0) + 1);
        }
      });
      return groups;
    }

    function getRoomHeaderClass(room){
      const group = normalizeText(room.GRUP_WARNA_RUANG).toUpperCase();
      return CONFIG.roomHeaderClasses[group] || 'group-default';
    }

    function formatSpecialText(slot){
      return normalizeText(slot.CATATAN) || 'Informasi akademik';
    }

    function getScheduleItemForSlot(day, roomCode, slotId){
      const targetDay = normalizeText(day).toLowerCase();
      const targetRoom = normalizeText(roomCode);
      const numericSlot = Number(slotId);
      return state.data.schedules.find(item => {
        const itemDay = normalizeText(item.HARI).toLowerCase();
        const itemRoom = normalizeText(item.KODE_RUANG);
        const start = Number(item.ID_SLOT_MULAI);
        const end = Number(item.ID_SLOT_SELESAI || item.ID_SLOT_MULAI);
        return itemDay === targetDay && itemRoom === targetRoom && numericSlot >= start && numericSlot <= end;
      }) || null;
    }

    function getCurrentDayName(){
      const map = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
      return map[new Date().getDay()];
    }

    function parseTimeLabelToMinutes(label){
      const clean = normalizeText(label).replace(/–/g, '-');
      const parts = clean.split('-').map(x => normalizeText(x));
      if (parts.length < 2) return null;

      const parsePart = (part) => {
        const m = part.match(/(\d{1,2})[.:](\d{2})/);
        if (!m) return null;
        return Number(m[1]) * 60 + Number(m[2]);
      };

      const start = parsePart(parts[0]);
      const end = parsePart(parts[1]);
      if (start === null || end === null) return null;
      return { start, end };
    }

    function getCurrentMinutes(){
      const now = new Date();
      return now.getHours() * 60 + now.getMinutes();
    }

    function getCurrentActiveSlotId(day){
      if (!state.data) return null;
      if (normalizeText(day) !== normalizeText(getCurrentDayName())) return null;

      const currentMinutes = getCurrentMinutes();
      const slots = getSlotsForDay(day);

      for (const slot of slots) {
        if (normalizeText(slot.TIPE_BARIS).toUpperCase() !== 'KULIAH') continue;
        const parsed = parseTimeLabelToMinutes(slot.LABEL_WAKTU);
        if (!parsed) continue;
        if (currentMinutes >= parsed.start && currentMinutes < parsed.end) {
          return Number(slot.ID_SLOT);
        }
      }
      return null;
    }

    function getCurrentLiveCourseSummary(day){
      const activeSlotId = getCurrentActiveSlotId(day);
      if (!activeSlotId) return '';
      const item = state.data?.schedules?.find(row =>
        normalizeText(row.HARI).toLowerCase() === normalizeText(day).toLowerCase() &&
        activeSlotId >= Number(row.ID_SLOT_MULAI) &&
        activeSlotId <= Number(row.ID_SLOT_SELESAI || row.ID_SLOT_MULAI)
      );
      if (!item) return 'Sedang berlangsung';
      const kode = normalizeText(item.KODE_MK);
      const nama = normalizeText(item.NAMA_MK);
      const ruang = normalizeText(item.KODE_RUANG);
      return ['Sedang berlangsung', kode, nama, ruang].filter(Boolean).join(' · ');
    }

    function buildTickerText(infoRows){
      const items = infoRows.map(row => {
        const tanggal = normalizeText(row.TANGGAL_INFO);
        const jenis = normalizeText(row.JENIS_INFO);
        const ket = normalizeText(row.KETERANGAN_INFO);
        return [tanggal, jenis, ket].filter(Boolean).join(' - ');
      }).filter(Boolean);

      return items.length ? items.join('     ✦     ') : CONFIG.tickerFallback;
    }

    function renderTicker(){
      el.tickerTrack.textContent = state.data ? buildTickerText(state.data.infos) : CONFIG.tickerFallback;
    }


    function getPastelColorByKodeMk(kodeMk){
      const code = normalizeText(kodeMk).toUpperCase().replace(/\s+/g, '');
      const m = code.match(/^([A-Z]+)(\d)/);
      const groupKey = m ? `${m[1]}${m[2]}xx` : code.slice(0, 2) || 'DEFAULT';

      const pastelMap = {
        'TI1xx': { bg: '#EEF4FA', text: '#2B3645' },
        'TI2xx': { bg: '#F0F7F0', text: '#2B3645' },
        'TI3xx': { bg: '#FFF9ED', text: '#2B3645' },
        'TI4xx': { bg: '#FAF0E9', text: '#2B3645' },
        'TI5xx': { bg: '#F3EEF8', text: '#2B3645' },
        'TI6xx': { bg: '#EEF6F1', text: '#2B3645' },
        'TI7xx': { bg: '#EEF5F6', text: '#2B3645' },
        'TI8xx': { bg: '#FAEFF0', text: '#2B3645' },
        'DEFAULT': { bg: '#F4F4F4', text: '#2B3645' }
      };

      return pastelMap[groupKey] || pastelMap.DEFAULT;
    }

    function renderCourseCell(item, isCurrent = false){
      const autoColor = getPastelColorByKodeMk(item.KODE_MK || '');
      const bg = autoColor.bg;
      const color = autoColor.text;
      return `
        <td class="course-cell ${isCurrent ? 'current-course' : ''}" style="background:${escapeHtml(bg)};color:${escapeHtml(color)};">
          ${isCurrent ? '<div class="live-badge">Sedang Berlangsung</div>' : ''}
          <div class="course-code">${escapeHtml(item.KODE_MK || '')}${item.KELAS ? ` (${escapeHtml(item.KELAS)})` : ''}</div>
          <div class="course-name">${escapeHtml(item.NAMA_MK || '')}</div>
          ${item.DOSEN ? `<div class="course-meta">Dosen : ${escapeHtml(item.DOSEN)}</div>` : ''}
          ${item.PROGRAM_ANGKATAN ? `<div class="course-meta">${escapeHtml(item.PROGRAM_ANGKATAN)}</div>` : ''}
          ${item.CATATAN ? `<div class="course-meta">${escapeHtml(item.CATATAN)}</div>` : ''}
        </td>
      `;
    }

    function applyResponsiveTableSize(){
      const table = document.getElementById('scheduleTable');
      if (!table || !state.data) return;

      const slots = getSlotsForDay(state.selectedDay);
      const kuliahCount = Math.max(1, slots.filter(slot => normalizeText(slot.TIPE_BARIS).toUpperCase() === 'KULIAH').length);
      const specialCount = Math.max(0, slots.length - kuliahCount);

      const stageHeight = Math.max(240, el.tableStage.clientHeight);
      const stageWidth = Math.max(320, el.tableStage.clientWidth);

      const headerHeight = Math.max(34, Math.min(42, stageHeight * 0.038));
      const specialWeight = 0.60;
      const borderReserve = (slots.length + 8) * 2.2;
      const bodyHeight = Math.max(110, stageHeight - headerHeight - borderReserve);
      const baseUnit = bodyHeight / (kuliahCount + specialCount * specialWeight);

      const rowHeight = Math.max(25, Math.min(34, baseUnit));
      const specialRowHeight = Math.max(17, Math.min(22, baseUnit * specialWeight));

      const roomCount = Math.max(1, state.data.rooms.length);
      const headerFont = Math.max(11, Math.min(13.5, stageWidth / (roomCount * 11.2)));
      const sessionFont = Math.max(9.8, Math.min(12, rowHeight * 0.34));
      const cellFont = Math.max(9.2, Math.min(11.2, rowHeight * 0.28));
      const codeFont = Math.max(8, Math.min(9.4, rowHeight * 0.22));
      const metaFont = Math.max(7, Math.min(8.4, rowHeight * 0.18));
      const specialFont = Math.max(8.6, Math.min(10.2, specialRowHeight * 0.42));

      table.style.setProperty('--thead-height', `${headerHeight}px`);
      table.style.setProperty('--row-height', `${rowHeight}px`);
      table.style.setProperty('--special-row-height', `${specialRowHeight}px`);
      table.style.setProperty('--header-font', `${headerFont}px`);
      table.style.setProperty('--session-font', `${sessionFont}px`);
      table.style.setProperty('--cell-font', `${cellFont}px`);
      table.style.setProperty('--code-font', `${codeFont}px`);
      table.style.setProperty('--meta-font', `${metaFont}px`);
      table.style.setProperty('--special-font', `${specialFont}px`);

      requestAnimationFrame(fitTableIfNeeded);
    }

    function fitTableIfNeeded(){
      const scaleBox = document.getElementById('tableScale');
      const table = document.getElementById('scheduleTable');
      if (!scaleBox || !table) return;

      scaleBox.style.width = '100%';
      scaleBox.style.transform = 'translate(0px, 0px) scale(1)';

      const stageWidth = el.tableStage.clientWidth;
      const stageHeight = el.tableStage.clientHeight;
      const tableHeight = table.offsetHeight;

      let scale = 1;
      if (tableHeight > stageHeight) {
        scale = stageHeight / tableHeight;
      }

      if (scale < 1) {
        scaleBox.style.width = `${100 / scale}%`;
      }

      const scaledHeight = tableHeight * scale;
      const offsetY = Math.max(0, (stageHeight - scaledHeight) / 2);

      scaleBox.style.transform = `translate(0px, ${offsetY}px) scale(${scale})`;
    }

    function renderTable(day){
      if (!state.data) return;

      const slots = getSlotsForDay(day);
      const rooms = state.data.rooms;
      const sessionGroups = groupSessionRows(slots);
      const renderedSessionStart = new Set();
      const activeSlotId = getCurrentActiveSlotId(day);

      if (!rooms.length) {
        el.tableStage.innerHTML = '<div class="error-box">Data RUANG belum ditemukan pada spreadsheet.</div>';
        return;
      }

      if (!slots.length) {
        el.tableStage.innerHTML = '<div class="error-box">Data SLOT belum ditemukan pada spreadsheet. Pastikan baris dengan JENIS_DATA = SLOT sudah terisi.</div>';
        return;
      }

      let html = `
        <div class="table-scale" id="tableScale">
          <table class="schedule" id="scheduleTable">
            <colgroup>
              <col style="width:64px">
              <col style="width:86px">
              ${rooms.map(() => '<col>').join('')}
            </colgroup>
            <thead>
              <tr>
                <th>SESI</th>
                <th>JAM</th>
                ${rooms.map(room => `<th class="room-head ${getRoomHeaderClass(room)}">${escapeHtml(room.NAMA_TAMPIL_RUANG || room.KODE_RUANG)}</th>`).join('')}
              </tr>
            </thead>
            <tbody>
      `;

      for (const slot of slots) {
        const slotType = normalizeText(slot.TIPE_BARIS).toUpperCase();
        const slotId = Number(slot.ID_SLOT);
        const isCurrentSlot = slotType === 'KULIAH' && activeSlotId === slotId;
        html += `<tr class="${isCurrentSlot ? 'current-row' : ''}">`;

        if (slotType === 'KULIAH') {
          const sesi = normalizeText(slot.SESI) || '-';
          if (!renderedSessionStart.has(sesi)) {
            html += `<td class="session-cell" rowspan="${sessionGroups.get(sesi) || 1}">${escapeHtml(sesi)}</td>`;
            renderedSessionStart.add(sesi);
          }

          html += `<td class="time-cell ${isCurrentSlot ? 'current-time' : ''}">${escapeHtml(slot.LABEL_WAKTU)}</td>`;

          for (const room of rooms) {
            const item = getScheduleItemForSlot(day, room.KODE_RUANG, slotId);
            html += item ? renderCourseCell(item, isCurrentSlot) : `<td class="empty-cell ${isCurrentSlot ? 'current-course' : ''}"></td>`;
          }
        } else {
          html += '<td class="session-empty"></td>';
          html += `<td class="special-time">${escapeHtml(slot.LABEL_WAKTU)}</td>`;
          html += `<td class="special-cell" colspan="${rooms.length}">${escapeHtml(formatSpecialText(slot))}</td>`;
        }

        html += '</tr>';
      }

      html += `
            </tbody>
          </table>
        </div>
      `;

      el.tableStage.innerHTML = html;
      requestAnimationFrame(() => {
        applyResponsiveTableSize();
        requestAnimationFrame(fitTableIfNeeded);
      });
    }

    function updateMiniStatus(){
      if (!state.data) {
        el.miniStatus.textContent = 'Memuat data spreadsheet...';
        return;
      }

      const slots = getSlotsForDay(state.selectedDay);
      const slotLabel = state.data.hasGlobalSlots && !state.data.slots.some(x => normalizeText(x.HARI).toLowerCase() === normalizeText(state.selectedDay).toLowerCase())
        ? `${slots.length} (slot global)`
        : `${slots.length}`;

      const liveSummary = getCurrentLiveCourseSummary(state.selectedDay);

      const items = [
        `Hari tampil: <strong>${escapeHtml(state.selectedDay)}</strong>`,
        `Ruang: <strong>${state.data.rooms.length}</strong>`,
        `Slot: <strong>${slotLabel}</strong>`,
        `Jadwal: <strong>${state.data.schedules.filter(x => normalizeText(x.HARI).toLowerCase() === normalizeText(state.selectedDay).toLowerCase()).length}</strong>`,
        liveSummary ? `<strong>${escapeHtml(liveSummary)}</strong>` : 'Belum ada perkuliahan yang sedang berlangsung',
        'Sumber: spreadsheet 1 sheet · Soft Premium'
      ];

      el.miniStatus.innerHTML = items
        .map(item => `<span class="status-item">${item}</span>`)
        .join('');
    }

    function showError(message){
      el.tableStage.innerHTML = `<div class="error-box">${message}</div>`;
      el.miniStatus.textContent = 'Gagal memuat data spreadsheet.';
    }

    async function hashText(text){
      const enc = new TextEncoder().encode(text);
      const hashBuffer = await crypto.subtle.digest('SHA-256', enc);
      return [...new Uint8Array(hashBuffer)].map(b => b.toString(16).padStart(2,'0')).join('');
    }

    async function fetchCsvText(){
      const response = await fetch(`${CONFIG.csvUrl}&v=${Date.now()}`, { cache:'no-store' });
      if (!response.ok) throw new Error('Gagal mengambil CSV dari spreadsheet yang dipublikasikan.');
      return await response.text();
    }

    async function applyCsv(csvText){
      state.data = buildDataModel(csvText);
      state.csvHash = await hashText(csvText);

      const candidateDays = state.data.days.length
        ? state.data.days
        : CONFIG.fallbackDays.filter(day => state.data.schedules.some(row => normalizeText(row.HARI).toLowerCase() === day.toLowerCase()));

      state.selectedDay = getCurrentAcademicDay(candidateDays);
      state.liveSlotKey = `${state.selectedDay}__${getCurrentActiveSlotId(state.selectedDay) || ''}`;
      renderTicker();
      updateMiniStatus();
      renderTable(state.selectedDay);
    }

    function configureAutoRefresh(){
      if (state.autoRefreshTimer) clearInterval(state.autoRefreshTimer);

      state.autoRefreshTimer = setInterval(async () => {
        if (state.autoRefreshBusy) return;
        state.autoRefreshBusy = true;
        try {
          const csvText = await fetchCsvText();
          const nextHash = await hashText(csvText);
          if (nextHash !== state.csvHash) {
            await applyCsv(csvText);
          }
        } catch (error) {
          console.error(error);
        } finally {
          state.autoRefreshBusy = false;
        }
      }, CONFIG.autoRefreshMs);
    }

    function startClock(){
      const timeFormatter = new Intl.DateTimeFormat('id-ID', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
      const dateFormatter = new Intl.DateTimeFormat('id-ID', { weekday:'long', day:'2-digit', month:'long', year:'numeric' });
      const tick = () => {
        const now = new Date();
        el.clockTime.textContent = timeFormatter.format(now);
        el.clockDate.textContent = dateFormatter.format(now);

        if (state.data) {
          const availableDays = state.data.days?.length ? state.data.days : CONFIG.fallbackDays;
          const autoDay = getCurrentAcademicDay(availableDays);
          if (autoDay && autoDay !== state.selectedDay && availableDays.includes(autoDay)) {
            state.selectedDay = autoDay;
            updateMiniStatus();
            renderTable(state.selectedDay);
            return;
          }

          const activeSlotId = getCurrentActiveSlotId(state.selectedDay);
          const nextLiveKey = `${state.selectedDay}__${activeSlotId || ''}`;
          if (nextLiveKey !== state.liveSlotKey) {
            state.liveSlotKey = nextLiveKey;
            updateMiniStatus();
            renderTable(state.selectedDay);
          }
        }
      };
      tick();
      setInterval(tick, 1000);
    }

    window.addEventListener('resize', () => {
      requestAnimationFrame(() => {
        applyResponsiveTableSize();
        requestAnimationFrame(fitTableIfNeeded);
      });
    });

    startClock();

    fetchCsvText()
      .then(applyCsv)
      .then(configureAutoRefresh)
      .catch(error => {
        showError(`${error.message}<br><br>Pastikan link Google Sheets sudah di-publish sebagai CSV publik dan formatnya mengikuti template 1 sheet.`);
      });
  </script>
</body>
</html>
